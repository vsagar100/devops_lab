---
name: Checkout-api CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["*"]

env:
  DEBIAN_FRONTEND: noninteractive
  PYTHONUNBUFFERED: 1

# On Pull request to "main" branch, first lets build the app, if all checks are successful in this job then only allow the PR merge.
# We will have branch protection rules or RuleSet enabled to avoid any failed PR merge to "main"

jobs:
  ci:
    runs-on:
      ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.push.head.sha }}
          fetch-depth: 0

      - name: setup-prereqs
        run: |
          set -euo pipefail
          [[ -n "${{ secrets.ACTIONS_STEP_DEBUG }}" ]] && set -x
          sudo apt update -y
      
      - name: python-setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir --upgrade pip \
          && pip install --no-cache-dir -r app/requirements.txt

      - name: Run App
        run: |
          cd app
          # Run the app
          uvicorn src.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &

          #Wait for app to boot
          sleep 3

          #Test if app working
          http_status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000)

          #Kill the app as it is no longer needed to run
          pkill -f uvicorn

          #Check the http code
          if ["$http_status" ne 200]; then
            echo "Failed to connect to app with status code $test"
            cat uvicorn.log #Print the app log
            exit 2
          fi
      

