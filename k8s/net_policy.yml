apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: checkout-api-netpol
  namespace: cloudops
spec:
  podSelector:
    matchLabels:
      app: checkout-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector: # Removed the dash here to combine with namespaceSelector
            matchLabels:
              k8s-app: kube-dns
      ports: # Aligned under the "- to" block
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

